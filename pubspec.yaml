name: play_craft_kids
description: ASMR Coloring Book App
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  audioplayers: ^5.2.1
  flutter_svg: ^2.0.9
  path_drawing: ^1.0.1
  lottie: ^3.3.0
  confetti: ^0.8.0
  supabase_flutter: ^2.0.0
  sizer: ^3.0.5
  flutter_screenutil: ^5.9.3
  pixelmatch: ^1.1.2
  image_hash: ^1.1.0
  image_compare_2: ^1.1.7
  diff_image2: ^1.3.0
  image: ^4.1.7
  pdf: 
  printing: 
  audio_session: ^0.2.3
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/app_content.json
    - assets/data/realistic_content_pack.json
    - assets/data/celebrate.json
    # - assets/references/
    - assets/images/
    # - assets/json/
    - assets/sounds/
    - assets/audio/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/poppins-regular.ttf
          weight: 400
        - asset: fonts/poppins_bold.ttf
          weight: 700
    - family: Regular
      fonts:
        - asset: fonts/poppins-regular.ttf
